[package]
name = "dump-shitty-claude-md"
version = "0.1.0"
edition = "2021"
description = "Migrate project CLAUDE.md files to AGENTS.md across all repos in your home directory"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
dirs = "7.0.0"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[profile.release]
lto = true
strip = true
